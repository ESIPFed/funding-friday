name: New Award Winner
description: Submit information for a new FUNding Friday award winner
title: "Add [YEAR] award winner: [Name]"
labels: ["new-award"]
body:
  - type: input
    id: year
    attributes:
      label: Award Year
      description: The year the award was given
      placeholder: "2025"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Lead Person / PI Name
      description: Full name of the principal investigator or team name
      placeholder: "Jane Smith"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Project Title
      description: Title as written on the poster
      placeholder: "My Awesome Earth Science Project"
    validations:
      required: true

  - type: textarea
    id: desc
    attributes:
      label: Project Description
      description: 1–3 sentences describing what the project does or aims to achieve. This is the most important field for discoverability.
      placeholder: "This project will..."
    validations:
      required: false

  - type: input
    id: co_pi
    attributes:
      label: Co-Investigators
      description: Comma-separated list of co-PI names, if any
      placeholder: "Alex Jones, Sam Lee"
    validations:
      required: false

  - type: dropdown
    id: participant_type
    attributes:
      label: Participant Type
      options:
        - attendee
        - student
        - educator
    validations:
      required: false

  - type: dropdown
    id: funding_amount
    attributes:
      label: Funding Amount
      options:
        - "5000"
        - "3000"
    validations:
      required: false

  - type: checkboxes
    id: assets
    attributes:
      label: Assets to attach
      description: Check what you are able to provide
      options:
        - label: Poster image (PNG)
        - label: Statement of work or final report (PDF)

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Anything else relevant (links, corrections, etc.)
    validations:
      required: false
